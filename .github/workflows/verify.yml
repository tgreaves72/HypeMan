name: Verify HypeMan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check documentation links and public assets
        run: npm run check:docs
      - name: Typecheck, test, and build
        run: npm run check
      - name: Install isolated Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Main extension browser checks
        run: npm run e2e
      - name: Conversation workbench browser checks
        run: npm run e2e:workbench
      - name: Offline study library and review checks
        run: npm run e2e:study
      - name: Rooftop and specialist UI browser checks
        run: npm run e2e:ui
      - name: Focused browser regressions
        run: |
          node tests/confirmation-browser.mjs
          node tests/message-content-browser.mjs
          node tests/navigation-continuation-browser.mjs
          node tests/conversation-activity-browser.mjs
      - run: npm run e2e:pdf
      - run: npm run e2e:auth
      - run: npm run e2e:hints
      - run: npm run e2e:projects
      - run: npm run e2e:execution
      - run: npm run e2e:messaging
      - run: npm run e2e:reminders
      - name: Preserve browser screenshots
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
